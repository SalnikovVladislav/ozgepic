# docker-compose.prod.yml — прод-оверрей для ozgepic (отдельный VPS).
# Применяется поверх docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# В .env должны быть:
#   DOMAIN, EXTRA_DOMAINS, LETSENCRYPT_EMAIL, SITE_BIND=127.0.0.1

services:
  # ─── Bot: в проде webhook-порт наружу не нужен (api ходит через docker-сеть)
  bot:
    ports: !reset []

  # ─── DB: то же самое — снаружи не нужна
  db:
    ports: !reset []


  # ─── Reverse proxy: nginx на 80/443 + Let's Encrypt ──────────────────
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      EXTRA_DOMAINS: ${EXTRA_DOMAINS}
      # Отключаем встроенный auto-envsubst nginx-entrypoint'а
      # (он подставляет ВСЕ env-переменные и ломает наш конфиг, где используются
      #  nginx-переменные $host, $request_uri и т.п.). Мы делаем envsubst сами.
      NGINX_ENVSUBST_TEMPLATE_DIR: /dev/null
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/templates:/etc/nginx/templates:ro
      - ./proxy/letsencrypt:/etc/letsencrypt
      - ./proxy/certbot-www:/var/www/certbot
    depends_on:
      - site
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        envsubst '$$DOMAIN $$EXTRA_DOMAINS' \
          < /etc/nginx/templates/default.conf.template \
          > /etc/nginx/conf.d/default.conf
        # Периодический reload, чтобы подхватить обновлённый LE-сертификат
        ( while :; do sleep 6h; nginx -s reload 2>/dev/null || true; done ) &
        exec nginx -g 'daemon off;'


  # ─── Certbot: автопродление сертификатов каждые 12 часов ─────────────
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./proxy/letsencrypt:/etc/letsencrypt
      - ./proxy/certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
                  while :; do
                    certbot renew --webroot -w /var/www/certbot --quiet;
                    sleep 12h & wait $${!};
                  done"
